name: Compilar ABCell Pro .exe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar código y regresiones
        shell: bash
        env:
          QT_QPA_PLATFORM: windows
        run: |
          mkdir -p artifacts/ui
          python -m compileall -q config core database integrations services ui tools tests main.py
          set -o pipefail
          python -u -m unittest discover -s tests -v 2>&1 | tee artifacts/ui/tests.log

      - name: Auditar todas las vistas y botones en Windows
        shell: bash
        env:
          QT_QPA_PLATFORM: windows
        run: |
          mkdir -p artifacts/ui
          set -o pipefail
          python -u tools/audit_ui.py --output artifacts/ui 2>&1 | tee artifacts/ui/audit.log

      - name: Publicar diagnóstico Windows
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SCALE: Windows
        run: python tools/publish_ui_check.py

      - name: Subir revisión de interfaz Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-ui-windows
          path: artifacts/ui/
          if-no-files-found: warn

      - name: Preparar icono ABCell Pro
        run: python tools/prepare_icon.py

      - name: Preparar platform-tools (ADB)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "platform_tools" | Out-Null
          $sdkAdbDir = ""
          if ($env:ANDROID_HOME -and (Test-Path (Join-Path $env:ANDROID_HOME "platform-tools\adb.exe"))) {
            $sdkAdbDir = Join-Path $env:ANDROID_HOME "platform-tools"
          } elseif ($env:ANDROID_SDK_ROOT -and (Test-Path (Join-Path $env:ANDROID_SDK_ROOT "platform-tools\adb.exe"))) {
            $sdkAdbDir = Join-Path $env:ANDROID_SDK_ROOT "platform-tools"
          }

          if ($sdkAdbDir) {
            Copy-Item (Join-Path $sdkAdbDir "adb.exe") "platform_tools\" -Force
            Copy-Item (Join-Path $sdkAdbDir "AdbWinApi.dll") "platform_tools\" -Force
            Copy-Item (Join-Path $sdkAdbDir "AdbWinUsbApi.dll") "platform_tools\" -Force
          } else {
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "pt.zip"
            Expand-Archive -Path "pt.zip" -DestinationPath "pt_tmp" -Force
            Copy-Item "pt_tmp\platform-tools\adb.exe" "platform_tools\" -Force
            Copy-Item "pt_tmp\platform-tools\AdbWinApi.dll" "platform_tools\" -Force
            Copy-Item "pt_tmp\platform-tools\AdbWinUsbApi.dll" "platform_tools\" -Force
            Remove-Item "pt.zip" -Force
            Remove-Item "pt_tmp" -Recurse -Force
          }

          foreach ($req in @("adb.exe", "AdbWinApi.dll", "AdbWinUsbApi.dll")) {
            if (-not (Test-Path (Join-Path "platform_tools" $req))) {
              throw "Falta archivo requerido de ADB: $req"
            }
          }
          Get-ChildItem "platform_tools"

      - name: Compilar ejecutable con PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --icon "ui/assets/abcell-pro.ico" `
            --version-file "config/windows_version_info.txt" `
            --name "ABCell Pro" `
            --hidden-import config.settings `
            --hidden-import config.assets `
            --hidden-import core.catalog_data `
            --hidden-import database.db_manager `
            --hidden-import services.workshop_service `
            --hidden-import integrations.adb_manager `
            --hidden-import integrations.printer_58mm `
            --hidden-import integrations.ticket_image `
            --hidden-import integrations.whatsapp_center `
            --hidden-import ui.layouts `
            --hidden-import ui.theme `
            --hidden-import ui.icons `
            --hidden-import ui.main_window `
            --hidden-import PySide6.QtSvg `
            --add-data "config;config" `
            --add-data "core;core" `
            --add-data "database;database" `
            --add-data "services;services" `
            --add-data "integrations;integrations" `
            --add-data "ui;ui" `
            --add-data "ui/assets/abcell-pro.ico;ui/assets" `
            --add-data "platform_tools;platform_tools" `
            main.py

      - name: Subir artefacto .exe
        uses: actions/upload-artifact@v4
        with:
          name: ABCell-Pro-Windows
          path: "dist/ABCell Pro.exe"
          if-no-files-found: error
