name: Compilar ABCell Pro .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar logo.ico
        shell: pwsh
        run: |
          python -c "from integrations.printer_58mm import guardar_ico; guardar_ico('logo.ico')"
          if (-not (Test-Path "logo.ico")) {
            throw "No se pudo generar logo.ico"
          }
          Get-Item "logo.ico"

      - name: Compilar ejecutable con PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --icon logo.ico `
            --name ABCell_Gestion_Taller `
            --add-data "config;config" `
            --add-data "core;core" `
            --add-data "database;database" `
            --add-data "services;services" `
            --add-data "integrations;integrations" `
            --add-data "ui;ui" `
            main.py

      - name: Subir artefacto .exe
        uses: actions/upload-artifact@v4
        with:
          name: ABCell_Gestion_Taller_exe
          path: dist/ABCell_Gestion_Taller.exe
          if-no-files-found: error
