name: Compilar demo sin internet

on:
  workflow_dispatch:
  push:
    branches: ['arena/e2b7fed6-abcell-pro']
    paths:
      - 'offline_demo/**'
      - 'tests/test_demo_*.py'
      - 'tools/package_demo.py'
      - 'tools/publish_demo_check.py'
      - '.github/workflows/build-demo.yml'

permissions:
  contents: read
  checks: write

jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
      DEMO_AUDIT_DIR: ${{ github.workspace }}/artifacts/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de compilación
        run: pip install PySide6 pyinstaller Pillow
      - name: Verificar aislamiento del paquete
        run: python -m unittest discover -s tests -p test_demo_package.py -v
      - name: Preparar código independiente sin módulos completos
        run: python tools/package_demo.py --output artifacts/demo-source --zip artifacts/ABCell-Pro-Demo-codigo.zip
      - name: Probar solo el código que se distribuirá
        shell: bash
        working-directory: artifacts/demo-source
        run: |
          mkdir -p ../ui
          set -o pipefail
          python -u -m unittest discover -s tests -p 'test_demo_*.py' -v 2>&1 | tee ../ui/tests.log
      - name: Publicar diagnóstico demo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python -m tools.publish_demo_check
      - name: Compilar exclusivamente el paquete demo
        working-directory: artifacts/demo-source
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name "ABCell Pro Demo" --icon "ui/assets/abcell-pro.ico" --version-file "offline_demo/windows_version_info.txt" --hidden-import PySide6.QtSvg --add-data "ui/assets;ui/assets" main.py
          if ($LASTEXITCODE -ne 0) { throw "Falló PyInstaller demo" }
          Copy-Item README.md "dist/LEEME.txt"
      - name: Publicar demo para distribuir
        uses: actions/upload-artifact@v4
        with:
          name: ABCell-Pro-Demo-Windows
          path: |
            artifacts/demo-source/dist/ABCell Pro Demo.exe
            artifacts/demo-source/dist/LEEME.txt
          if-no-files-found: error
      - name: Publicar código reducido
        uses: actions/upload-artifact@v4
        with:
          name: ABCell-Pro-Demo-codigo
          path: artifacts/ABCell-Pro-Demo-codigo.zip
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-demo-windows
          path: artifacts/ui/
